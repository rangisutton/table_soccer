<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table Soccer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060618;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }
    canvas { display: block; }

    .side-panel {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 120px;
      background: #050520;
      border: 1px solid #0d1f33;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      text-align: center;
    }
    #panel-left  { left: 0; }
    #panel-right { right: 0; }

    .player-name {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #334455;
    }
    .player-score {
      font-size: 58px;
      font-weight: bold;
      line-height: 1;
      text-shadow: 0 0 16px currentColor;
    }
    .player-status {
      font-size: 10px;
      color: #445566;
      min-height: 28px;
      line-height: 1.6;
    }
    .goal-pips {
      display: flex;
      gap: 5px;
      justify-content: center;
    }
    .pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: transparent;
    }

    #panel-left  .player-score { color: #00ffee; }
    #panel-left  .pip          { border: 1px solid #115566; }
    #panel-left  .pip.filled   { background: #00ffee; border-color: #00ffee; }

    #panel-right .player-score { color: #ff00cc; }
    #panel-right .pip          { border: 1px solid #551144; }
    #panel-right .pip.filled   { background: #ff00cc; border-color: #ff00cc; }

    .side-panel.is-active .player-name   { color: #7799aa; }
    .side-panel.is-active .player-status { color: #99bbcc; }
    #panel-left.is-active  { border-color: #00ffee44; }
    #panel-right.is-active { border-color: #ff00cc44; }

    #settings-panel { display: none; margin-top: 12px; width: 100%; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 6px; }
    .setting-label { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: #334455; flex: 1; text-align: left; }
    .setting-val { font-size: 11px; color: #aaccdd; width: 28px; text-align: center; }
    .setting-btn { background: #001118; border: 1px solid #224455; color: #00ffee; font-family: monospace; font-size: 13px; cursor: pointer; width: 22px; line-height: 1; padding: 1px 0; }
    .setting-btn:hover { color: #ffffff; }
  </style>
  <script type="module" crossorigin src="./assets/index-B5pxnRKs.js"></script>
</head>
<body>
  <div id="panel-left" class="side-panel">
    <div class="player-name">Player 1</div>
    <div class="player-score" id="p1-score">0</div>
    <div class="goal-pips" id="p1-pips"></div>
    <div class="player-status" id="p1-status"></div>
    <div id="settings-panel"></div>
  </div>

  <div id="panel-right" class="side-panel">
    <div class="player-name">Player 2</div>
    <div class="player-score" id="p2-score">0</div>
    <div class="goal-pips" id="p2-pips"></div>
    <div class="player-status" id="p2-status"></div>
  </div>

</body>
</html>
